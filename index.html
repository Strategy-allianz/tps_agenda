<!-- Tech Powerhouse Summit: Agenda component (self-contained: HTML + CSS + JS) -->
<section id="programme" class="tp-agenda">
  <style>
    .tp-agenda{
      --tp-dark:#022C42;--tp-deep:#004250;--tp-teal:#008483;--tp-blue:#0080A6;--tp-orange:#EB6317;
      --surface:#EEF5F6;--card:#FFFFFF;--text:#3E4A50;--head:#022C42;--line:#CBD8DC;--accent:#00706F;
      --font-display:"Allianz Neo","Manrope",system-ui,sans-serif;
      --font-body:"Allianz Neo Condensed","DM Sans",system-ui,sans-serif;
      background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:1.15rem;line-height:1.5;
      padding:clamp(2.6rem,6vw,4.5rem) 0;box-sizing:border-box
    }
    @media (prefers-color-scheme: dark){
      .tp-agenda{--surface:#0A2837;--card:#0E3043;--text:#D3E1E6;--head:#FFFFFF;--line:#1D4457;--accent:#6FD8D4}
    }
    .tp-agenda *,.tp-agenda *::before,.tp-agenda *::after{box-sizing:inherit}
    .tp-agenda .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
    .tp-agenda h2,.tp-agenda h3{font-family:var(--font-display);color:var(--head);margin:0;line-height:1.12}
    .tp-agenda .eyebrow{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin-bottom:.8rem}
    .tp-agenda .title{font-size:clamp(1.8rem,4vw,2.75rem);font-weight:700;max-width:24ch}
    .tp-agenda .head{display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;flex-wrap:wrap}
    .tp-agenda .tz{font-family:var(--font-display);font-size:.85rem;display:flex;align-items:center;gap:.6rem;color:var(--head)}
    .tp-agenda .tz select{font-family:var(--font-display);font-size:.9rem;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--head);max-width:100%}
    .tp-agenda .tz{max-width:100%}
    .tp-agenda .tz select{min-width:0;flex:1 1 auto}
    .tp-agenda .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem}
    .tp-agenda .chip{font-family:var(--font-display);font-size:.85rem;font-weight:700;padding:.45rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--head);cursor:pointer}
    .tp-agenda .chip[aria-pressed="true"]{background:var(--tp-dark);color:#fff;border-color:var(--tp-dark)}
    .tp-agenda .chip.oly[aria-pressed="true"]{background:var(--tp-orange);border-color:var(--tp-orange);color:#fff}
    @media (prefers-color-scheme: dark){
      .tp-agenda .chip[aria-pressed="true"]{background:#fff;color:var(--tp-dark);border-color:#fff}
      .tp-agenda .chip.oly[aria-pressed="true"]{background:var(--tp-orange);border-color:var(--tp-orange);color:#fff}
    }
    .tp-agenda .legend{display:flex;align-items:center;gap:.55rem;margin:1.1rem 0 0;font-family:var(--font-display);font-size:.88rem;color:var(--head)}
    .tp-agenda .legend i{width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);flex:none}
    .tp-agenda .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.1rem;margin-top:1.6rem;align-items:start}
    .tp-agenda .day{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .tp-agenda .dayhead{padding:1.1rem 1.3rem;color:#fff}
    .tp-agenda .d1 .dayhead{background:var(--tp-blue)}
    .tp-agenda .d2 .dayhead{background:var(--tp-teal)}
    .tp-agenda .d3 .dayhead{background:var(--tp-deep)}
    .tp-agenda .dd{font-family:var(--font-display);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
    .tp-agenda .dayhead h3{color:#fff;font-size:1.45rem;margin-top:.2rem}
    .tp-agenda .dayhead p{margin:.25rem 0 0;font-size:.95rem;opacity:.92}
    .tp-agenda .slots{list-style:none;margin:0;padding:.3rem 1.3rem .6rem}
    .tp-agenda .slots li{padding:1rem 0;border-bottom:1px solid var(--line)}
    .tp-agenda .slots li:last-child{border-bottom:none}
    .tp-agenda .slots li.hl{background:linear-gradient(90deg,rgba(235,99,23,.10),transparent 60%);margin:0 -1.3rem;padding-left:1.3rem;padding-right:1.3rem}
    .tp-agenda .t{font-family:var(--font-display);font-size:.8rem;color:var(--accent);font-weight:700;display:block;margin-bottom:.35rem}
    .tp-agenda .slots b{font-family:var(--font-display);color:var(--head);font-size:1.02rem;display:block;line-height:1.25;margin-bottom:.25rem}
    .tp-agenda .s{font-size:.98rem;display:block;line-height:1.35}
    .tp-agenda .who{font-size:.88rem;display:block;margin-top:.4rem;opacity:.85;font-style:normal}
    .tp-agenda .pill{display:inline-block;font-family:var(--font-display);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:.12rem .45rem;margin:0 .3rem .35rem 0}
    .tp-agenda .pill.sum{background:var(--tp-deep);color:#fff}
    .tp-agenda .pill.oly{background:var(--tp-orange);color:#fff}
    .tp-agenda .olyline{display:flex;gap:.5rem;align-items:flex-start;margin-top:.55rem;font-size:.92rem;line-height:1.35}
    .tp-agenda .olyline i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tp-orange);margin-top:.5rem}
    .tp-agenda .olyline b{display:inline;font-size:.92rem;margin:0}
    .tp-agenda .note{margin-top:1.1rem;font-size:.92rem}
    .tp-agenda :focus-visible{outline:3px solid var(--tp-orange);outline-offset:3px}
  </style>

  <div class="wrap">
    <div class="head">
      <div>
        <div class="eyebrow">What and when</div>
        <h2 class="title">Check the agenda &amp; local time</h2>
      </div>
      <label class="tz">Show times in <select id="tpTz" aria-label="Time zone"></select></label>
    </div>

    <div class="chips" id="tpChips" role="group" aria-label="Filter the agenda">
      <button class="chip" type="button" data-f="all" aria-pressed="true">All sessions</button>
      <button class="chip" type="button" data-f="d1" aria-pressed="false">Wed 11 Nov</button>
      <button class="chip" type="button" data-f="d2" aria-pressed="false">Thu 12 Nov</button>
      <button class="chip" type="button" data-f="d3" aria-pressed="false">Fri 13 Nov</button>
      <button class="chip oly" type="button" data-f="oly" aria-pressed="false">Olympics of Growth moments</button>
    </div>

    <div class="days" id="tpDays"></div>
    <p class="note">Times are shown in <span id="tpTzName">CET (UTC+1)</span>. Change the time zone above to see your local time.</p>
  </div>

  <script>
  (function(){
    /* Times are in CET, as minutes from midnight (570 = 09:30) */
    var S=[
      {id:1,day:1,s:570,e:660,title:"Kick-off: AI is now",
       sum:"Why stepping up is no longer optional, the plan behind it, and an outside-in view from regulated financial services.",
       who:"Axel Schell, Alexander Heinrich and an external speaker",oly:"The Top 8 squads and their challenges, revealed live"},
      {id:2,day:2,s:675,e:735,title:"How AZT is enabling the Group’s AI transformation",
       sum:"From the AI Factory to the R&D Hub, and how an idea travels from use case to delivery at scale.",
       who:"Maria Huber, Sandra Volkanovska",oly:"Hand-over to the Olympics of Growth"},
      {id:3,day:2,s:755,e:810,title:"Reworking how we build: AI-native squads",
       sum:"A conversation about what has changed in software engineering, with frontrunner teams telling it like it is.",
       who:"Jürgen Schlauch, Stefano D’Acunzo and three frontrunner teams",oly:"A look inside the hackathon, and how to vote"},
      {id:4,day:3,s:540,e:600,title:"Security and digital resilience",
       sum:"Why resilience is the foundation for AI at scale, how the threat landscape has shifted, and practical guidance for an AI-powered workplace.",
       who:"Andrew Gensler",oly:""},
      {id:5,day:3,s:605,e:720,title:"Skills and mindset, made visible: the Tech Entrepreneurs, live",
       sum:"Colleagues tell their own story of skills and mindset, then the Olympics of Growth Final and the close of the Summit.",
       who:"Vicky Drakousis, Alexander Heinrich, Jihan Nadri and a panel of colleagues",oly:"The Final: Top 3 and winners crowned"}
    ];
    var HEADS={1:["Summit day 1","Wed 11 Nov","Live from Munich"],
               2:["Summit day 2","Thu 12 Nov","Online"],
               3:["Summit day 3","Fri 13 Nov","Online and live from Bangkok"]};
    /* [offset in minutes vs CET, label, cities] */
    var TZLIST=[
      ["Europe",[[0,"CET (UTC+1)","Munich, Vienna, Paris, Prague, Bratislava, Barcelona, Budapest"],[-60,"GMT (UTC+0)","Guildford"],[60,"EET (UTC+2)","Bucharest"]]],
      ["Asia",[[270,"IST (UTC+5:30)","Pune, Trivandrum"],[360,"ICT (UTC+7)","Bangkok"],[420,"MYT (UTC+8)","Kuala Lumpur, Singapore"]]]
    ];

    var off=0,filter="all",TZ={};
    TZLIST.forEach(function(g){g[1].forEach(function(t){TZ[t[0]]=t[1]})});
    var daysEl=document.getElementById("tpDays"),sel=document.getElementById("tpTz"),chips=document.getElementById("tpChips");

    function pad(n){return String(n).padStart(2,"0")}
    function fmt(m){var p=0;while(m>=1440){m-=1440;p++}return pad(Math.floor(m/60))+":"+pad(m%60)+(p?" (+1)":"")}
    function match(x){return filter==="all"||(filter==="d1"&&x.day===1)||(filter==="d2"&&x.day===2)||(filter==="d3"&&x.day===3)||(filter==="oly"&&x.oly)}

    function render(){
      var html="";
      [1,2,3].forEach(function(d){
        var items=S.filter(function(x){return x.day===d&&match(x)});
        if(!items.length)return;
        html+='<div class="day d'+d+'"><div class="dayhead"><div class="dd">'+HEADS[d][0]+'</div><h3>'+HEADS[d][1]+'</h3><p>'+HEADS[d][2]+'</p></div><ul class="slots">'+
          items.map(function(x){
            return '<li'+(filter==="oly"&&x.oly?' class="hl"':'')+'>'+
              '<span class="t">'+fmt(x.s+off)+' – '+fmt(x.e+off)+'</span>'+
              '<span class="pill sum">Session '+x.id+'</span>'+(x.oly?'<span class="pill oly">Olympics of Growth</span>':'')+
              '<b>'+x.title+'</b><span class="s">'+x.sum+'</span><em class="who">'+x.who+'</em>'+
              (x.oly?'<span class="olyline"><i></i><span><b>Olympics of Growth:</b> '+x.oly+'</span></span>':'')+
              '</li>';
          }).join("")+'</ul></div>';
      });
      daysEl.innerHTML=html;
    }

    sel.innerHTML=TZLIST.map(function(g){
      return '<optgroup label="'+g[0]+'">'+g[1].map(function(t){
        return '<option value="'+t[0]+'">'+t[1].split(" ")[0]+' ('+t[2]+')</option>';
      }).join("")+'</optgroup>';
    }).join("");
    sel.value="0";
    sel.addEventListener("change",function(){
      off=parseInt(sel.value,10)||0;
      document.getElementById("tpTzName").textContent=TZ[off];
      render();
    });
    chips.addEventListener("click",function(e){
      var b=e.target.closest(".chip");if(!b)return;
      filter=b.dataset.f;
      chips.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===b))});
      render();
    });
    render();
  })();
  </script>
</section>
